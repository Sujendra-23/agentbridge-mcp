name: Scenario tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run service and real MCP scenarios
        run: python -m pytest -q --junitxml=test-results/scenarios.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-test-results
          path: test-results/scenarios.xml
